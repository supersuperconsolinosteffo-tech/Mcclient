[package]
name = "vespera-client-tauri"
version = "1.0.0"
description = "Vespera Client — Optional Tauri 2 Rust Host Wrapper"
authors = ["Vespera Labs"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
